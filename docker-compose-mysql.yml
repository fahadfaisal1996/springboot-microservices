version: '3.8'

services:
  mysql-dev:
    image: mysql:8.0
    container_name: mysql-dev
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-dev-data:/var/lib/mysql

volumes:
  mysql-dev-data:
